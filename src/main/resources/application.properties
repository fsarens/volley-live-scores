spring.application.name=volley-live-scores

# Trust reverse proxy headers (Railway, etc.) so OAuth2 redirect URIs use the correct public HTTPS URL
server.forward-headers-strategy=FRAMEWORK

# Port — Railway/Render inject PORT env var; falls back to 8080 locally
server.port=${PORT:8080}

# MongoDB URI - overridden by application-local.properties locally, or SPRING_MONGODB_URI env var in production
spring.mongodb.uri=mongodb://localhost:27017/volley-live-scores

# Google OAuth2 — set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Railway environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
