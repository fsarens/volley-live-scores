<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Game Planning - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        .date-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .date-nav a { text-decoration: none; font-size: 1.4em; color: #555; }

        /* Timeblock sections */
        .section { border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
        .section-header { background: #f0f0f0; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; }
        .section-header-left { display: flex; align-items: center; gap: 10px; }
        .section-title { font-weight: bold; font-size: 15px; color: #333; }
        .game-count { font-size: 12px; color: #888; background: #ddd; padding: 2px 8px; border-radius: 10px; }
        .section-empty { padding: 12px 16px; color: #aaa; font-size: 13px; font-style: italic; }
        .full-badge { font-size: 11px; color: #888; border: 1px solid #ccc; padding: 5px 10px; border-radius: 4px; background: #e8e8e8; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 6px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 12px; color: #666; font-weight: 600; }
        td { padding: 7px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafff8; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .SCHEDULED { background: #e0f0ff; color: #0066cc; }
        .IN_PROGRESS { background: #fff0e0; color: #cc6600; }
        .FINISHED { background: #e0ffe0; color: #006600; }

        form.inline { display: inline; }
        button.delete { background: none; border: none; color: #cc0000; cursor: pointer; font-size: 0.85em; }
        button.delete:hover { text-decoration: underline; }

        .btn-add { background: #0066cc; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
        .btn-add:hover { background: #0052a3; }

        /* Modal */
        dialog { border: none; border-radius: 8px; padding: 0; width: 560px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
        dialog::backdrop { background: rgba(0,0,0,0.45); }
        .modal-header { background: #0066cc; color: #fff; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-radius: 8px 8px 0 0; }
        .modal-header h2 { font-size: 15px; margin: 0; }
        .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; padding: 0 2px; }
        .modal-body { padding: 18px; }
        .modal-footer { padding: 14px 18px; border-top: 1px solid #eee; display: flex; gap: 10px; justify-content: flex-end; }
        .modal-timeblock { display: inline-block; background: #e0f0ff; color: #0066cc; font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 4px; margin-bottom: 14px; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-row label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9em; color: #555; }
        .form-row select, .form-row input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
        .btn-cancel { background: #fff; color: #555; border: 1px solid #ccc; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-submit { background: #0066cc; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-submit:hover { background: #0052a3; }
    </style>
</head>
<body>

<div th:replace="~{fragments/admin-nav :: admin-nav('admin')}"></div>

<div style="max-width:900px; margin:0 auto; padding:20px;">
<h1>Game Planning</h1>

<!-- Date navigation -->
<div class="date-nav">
    <a th:href="@{/admin(date=${date.minusDays(1)})}">&larr;</a>
    <strong th:text="${#temporals.format(date, 'EEEE d MMMM yyyy')}"></strong>
    <a th:href="@{/admin(date=${date.plusDays(1)})}">&rarr;</a>
    <input type="date" id="datePicker" th:value="${date}" onchange="window.location='/admin?date='+this.value">
</div>

<!-- Error message -->
<div th:if="${error}" style="background:#ffe0e0; border:1px solid #cc0000; border-radius:6px; padding:10px 16px; margin-bottom:16px; color:#cc0000;">
    ⚠️ <span th:text="${error}"></span>
</div>

<!-- Timeblock sections -->
<div th:each="tb : ${timeBlocks}" class="section">
    <div class="section-header">
        <div class="section-header-left">
            <span class="section-title" th:text="${tb.name().replace('BLOCK_', '') + ':00'}"></span>
            <span class="game-count"
                  th:text="${gamesByBlock[tb.name()].size() + ' game' + (gamesByBlock[tb.name()].size() == 1 ? '' : 's')}"></span>
        </div>
        <!-- Add game button when courts are still available -->
        <button th:if="${gamesPerBlock[tb.name()].size() < totalCourts}"
                class="btn-add"
                th:attr="onclick='openAddGame(\'' + ${tb.name()} + '\')'">+ Add game</button>
        <span th:if="${gamesPerBlock[tb.name()].size() >= totalCourts}" class="full-badge">All courts taken</span>
    </div>

    <!-- Games in this block -->
    <div th:if="${!gamesByBlock[tb.name()].isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th>Court</th>
                    <th>Home team</th>
                    <th>Away team</th>
                    <th>Rules</th>
                    <th>Status</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="game : ${gamesByBlock[tb.name()]}">
                    <td th:text="${game.court}"></td>
                    <td th:text="${game.homeTeam.name}"></td>
                    <td th:text="${game.awayTeam}"></td>
                    <td th:text="${game.gameRules}"></td>
                    <td><span class="badge" th:classappend="${game.status}" th:text="${game.status}"></span></td>
                    <td><a th:href="@{/score/{id}(id=${game.id})}" target="_blank" style="font-size:0.85em; color:#0066cc;">Score ↗</a></td>
                    <td>
                        <form class="inline" th:action="@{/admin/games/{id}/delete(id=${game.id})}" method="post"
                              onsubmit="return confirm('Delete this game?')">
                            <input type="hidden" name="date" th:value="${date}">
                            <button type="submit" class="delete">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${gamesByBlock[tb.name()].isEmpty()}" class="section-empty">No games in this time slot.</div>
</div>

<!-- Add game modal -->
<dialog id="addGameDialog">
    <div class="modal-header">
        <h2>Add game</h2>
        <button class="modal-close" onclick="document.getElementById('addGameDialog').close()">×</button>
    </div>
    <form th:action="@{/admin/games}" method="post">
        <div class="modal-body">
            <input type="hidden" name="date" th:value="${date}">
            <div class="modal-timeblock" id="modalTimeblockLabel"></div>
            <div class="form-row">
                <label>
                    Time block
                    <select name="timeBlock" id="timeBlockSelect" required>
                        <option th:each="tb : ${timeBlocks}"
                                th:value="${tb}"
                                th:text="${tb.name().replace('BLOCK_', '') + ':00'}"></option>
                    </select>
                </label>
                <label>
                    Court
                    <select name="court" id="courtSelect" required>
                        <option th:each="c : ${courts}" th:value="${c}" th:text="${c}"></option>
                    </select>
                </label>
            </div>
            <div class="form-row">
                <label style="flex:1">
                    Home team
                    <select name="homeTeamCode" id="homeTeamSelect" required>
                        <option value="">-- select --</option>
                        <option th:each="team : ${teams}" th:value="${team.code}" th:text="${team.name}"></option>
                    </select>
                </label>
                <label style="flex:1">
                    Away team (name)
                    <input type="text" name="awayTeam" placeholder="e.g. VC Leuven" required>
                </label>
            </div>
            <div class="form-row">
                <label>
                    Game rules
                    <select name="gameRules" id="gameRulesSelect" required>
                        <option th:each="gr : ${gameRulesList}" th:value="${gr}" th:text="${gr}"></option>
                    </select>
                </label>
                <label>
                    Away team color
                    <select name="awayColor" required
                            th:style="${'background:' + T(be.volley.live.model.TeamColor).RED.hex + '; color:#fff'}"
                            onchange="this.style.background=this.options[this.selectedIndex].dataset.hex; this.style.color=this.options[this.selectedIndex].dataset.hex==='#ffffff'?'#000':'#fff'">
                        <option th:each="c : ${colors}"
                                th:value="${c.name()}"
                                th:text="${c.name()}"
                                th:attr="data-hex=${c.hex}"
                                th:style="${'background:' + c.hex + '; color:' + (c == T(be.volley.live.model.TeamColor).WHITE ? '#000' : '#fff')}">
                        </option>
                    </select>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="document.getElementById('addGameDialog').close()">Cancel</button>
            <button type="submit" class="btn-submit">Add game</button>
        </div>
    </form>
</dialog>

<script th:inline="javascript">
    const teamRules = /*[[${teamRulesMap}]]*/ {};
    const usedCourtsPerBlock = /*[[${gamesPerBlock}]]*/ {};

    function syncGameRules(teamCode) {
        const rules = teamRules[teamCode] || 'YOUTH';
        const sel = document.getElementById('gameRulesSelect');
        for (let i = 0; i < sel.options.length; i++) {
            if (sel.options[i].value === rules) { sel.selectedIndex = i; break; }
        }
    }

    document.getElementById('homeTeamSelect').addEventListener('change', function() {
        syncGameRules(this.value);
    });

    function updateCourtOptions(timeBlock) {
        const taken = usedCourtsPerBlock[timeBlock] || [];
        const courtSel = document.getElementById('courtSelect');
        let firstAvailable = null;
        for (let i = 0; i < courtSel.options.length; i++) {
            const opt = courtSel.options[i];
            const isTaken = taken.includes(opt.value);
            opt.disabled = isTaken;
            opt.style.color = isTaken ? '#bbb' : '';
            if (!isTaken && firstAvailable === null) firstAvailable = i;
        }
        if (firstAvailable !== null) courtSel.selectedIndex = firstAvailable;
    }

    document.getElementById('timeBlockSelect').addEventListener('change', function() {
        updateCourtOptions(this.value);
    });

    function openAddGame(timeBlock) {
        const tbSel = document.getElementById('timeBlockSelect');
        for (let i = 0; i < tbSel.options.length; i++) {
            if (tbSel.options[i].value === timeBlock) { tbSel.selectedIndex = i; break; }
        }
        updateCourtOptions(timeBlock);
        const label = timeBlock.replace('BLOCK_', '') + ':00';
        document.getElementById('modalTimeblockLabel').textContent = label;
        const dialog = document.getElementById('addGameDialog');
        dialog.showModal();
        dialog.addEventListener('click', function(e) {
            if (e.target === dialog) dialog.close();
        }, { once: true });
    }
</script>
</div>
</body>
</html>
