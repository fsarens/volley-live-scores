<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVOC Live Scores</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: #0d2137;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* ── Topbar ── */
        .topbar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            padding: 0 2vw;
            height: 9vh;
            background: rgba(0,0,0,0.35);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 0.8vw;
        }
        .topbar-logo { font-size: 3vh; }
        .topbar-title {
            font-size: 2.4vh;
            font-weight: bold;
            color: #90caf9;
            letter-spacing: 0.05em;
        }
        .topbar-center {
            text-align: center;
            font-size: 2.2vh;
            color: rgba(255,255,255,0.55);
            font-variant-numeric: tabular-nums;
        }
        .topbar-right {
            text-align: right;
            font-size: 2.2vh;
            color: rgba(255,255,255,0.55);
            font-variant-numeric: tabular-nums;
        }

        /* ── Main area ── */
        .main {
            height: 91vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Game grid ── */
        .grid {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }

        /* ── Game card ── */
        .game-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 1.5vw;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            position: relative;
            gap: 0;
        }

        .card-meta {
            position: absolute;
            top: 2vh;
            left: 0; right: 0;
            text-align: center;
            font-size: 1.6vh;
            color: #90caf9;
            letter-spacing: 0.04em;
        }

        .status-badge {
            position: absolute;
            top: 5.5vh;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.3vh 1vw;
            border-radius: 3px;
            font-size: 1.3vh;
            font-weight: bold;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        .status-SCHEDULED { background: #1a3a5c; color: #90caf9; }
        .status-FINISHED  { background: #1a3c1a; color: #81c784; }

        .team-home {
            font-size: 8vh;
            font-weight: bold;
            text-align: center;
            line-height: 1.15;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .team-away {
            font-size: 5.5vh;
            font-weight: bold;
            text-align: center;
            line-height: 1.15;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .vs-sep {
            font-size: 1.8vh;
            color: rgba(255,255,255,0.3);
            margin: 1.2vh 0;
        }

        .score-divider {
            width: 40%;
            height: 1px;
            background: rgba(255,255,255,0.12);
            margin: 2vh 0 1.5vh;
        }

        .sets-score {
            display: flex;
            align-items: baseline;
            gap: 1.2vw;
            font-size: 18vh;
            font-weight: bold;
            line-height: 1;
        }
        .sets-sep {
            font-size: 10vh;
            color: rgba(255,255,255,0.25);
        }

        .current-score {
            display: flex;
            align-items: baseline;
            gap: 0.8vw;
            font-size: 8vh;
            font-weight: bold;
            margin-top: 1.5vh;
            color: rgba(255,255,255,0.6);
        }
        .current-sep {
            font-size: 5vh;
            color: rgba(255,255,255,0.2);
        }

        .set-history {
            display: flex;
            gap: 1.2vw;
            font-size: 2.8vh;
            font-weight: bold;
            margin-top: 1.2vh;
            flex-wrap: wrap;
            justify-content: center;
        }
        .set-result { white-space: nowrap; }

        .no-games {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3vh;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <span class="topbar-logo">🏐</span>
        <span class="topbar-title">WAVOC Live Scores</span>
    </div>
    <div class="topbar-center" id="timeblock"></div>
    <div class="topbar-right" id="clock"></div>
</div>

<div class="main">
    <div class="grid" id="grid"></div>
    <div class="no-games" id="no-games" style="display:none">No games today</div>
</div>

<script>
    // ── DOM refs (grabbed once — never null) ───────────────────────────────────
    const elGrid    = document.getElementById('grid');
    const elNoGames = document.getElementById('no-games');
    const elClock   = document.getElementById('clock');
    const elBlock   = document.getElementById('timeblock');

    // ── Clock ──────────────────────────────────────────────────────────────────
    function updateClock() {
        const now  = new Date();
        const date = now.toLocaleDateString('en-BE', { day: 'numeric', month: 'short' });
        const time = now.toLocaleTimeString('en-BE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        elClock.textContent = date + '  ·  ' + time;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Data refresh ───────────────────────────────────────────────────────────
    const TIME_BLOCK = /*[[${timeBlock}]]*/ '';

    async function refresh() {
        let games;
        try {
            const url = '/api/games/today' + (TIME_BLOCK ? '?timeBlock=' + TIME_BLOCK : '');
            const r = await fetch(url);
            if (!r.ok) return;
            games = await r.json();
        } catch (e) { return; }

        // Only fetch scores for games that have one (IN_PROGRESS or FINISHED)
        const scores = await Promise.all(
            games.map(g =>
                (g.status === 'IN_PROGRESS' || g.status === 'FINISHED')
                    ? fetch('/api/games/' + g.id + '/score')
                        .then(r => r.ok ? r.json() : null)
                        .catch(() => null)
                    : Promise.resolve(null)
            )
        );

        renderGames(games, scores);
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    function renderGames(games, scores) {
        if (!games || games.length === 0) {
            elGrid.style.display = 'none';
            elNoGames.style.display = 'flex';
            elBlock.textContent = '';
            return;
        }

        elGrid.style.display = 'flex';
        elNoGames.style.display = 'none';
        elGrid.innerHTML = games.map((game, i) => renderCard(game, scores[i])).join('');

        // Show unique timeblocks in topbar center
        const blocks = [...new Set(games.map(g => g.timeBlock).filter(Boolean))]
            .map(b => b.replace('BLOCK_', '') + ':00')
            .join('  ·  ');
        elBlock.textContent = blocks;
    }

    function renderCard(game, score) {
        const homeColor = (game.homeTeam && game.homeTeam.color) || '#ffffff';
        const status    = game.status || 'SCHEDULED';
        const homeCode  = esc(game.homeTeam ? game.homeTeam.code : '');

        // Badge: only for SCHEDULED and FINISHED
        const badgeHtml = (status === 'SCHEDULED' || status === 'FINISHED')
            ? `<span class="status-badge status-${status}">${status}</span>`
            : '';

        let setsHtml    = '';
        let currentHtml = '';
        let historyHtml = '';

        if (score && (status === 'IN_PROGRESS' || status === 'FINISHED')) {
            const homeSets = score.sets ? score.sets.filter(s => s.home > s.away).length : 0;
            const awaySets = score.sets ? score.sets.filter(s => s.away > s.home).length : 0;

            setsHtml = `
                <div class="sets-score">
                    <span style="color:${homeColor}">${homeSets}</span>
                    <span class="sets-sep">-</span>
                    <span style="color:#aaaaaa">${awaySets}</span>
                </div>`;

            if (status === 'IN_PROGRESS') {
                currentHtml = `
                    <div class="current-score">
                        <span style="color:${homeColor}">${score.currentSetHome}</span>
                        <span class="current-sep">-</span>
                        <span style="color:#aaaaaa">${score.currentSetAway}</span>
                    </div>`;
            }

            if (status === 'FINISHED' && score.sets && score.sets.length > 0) {
                const setSpans = score.sets.map(s => {
                    const winColor = s.home > s.away ? homeColor : '#aaaaaa';
                    return `<span class="set-result" style="color:${winColor}">${s.home}-${s.away}</span>`;
                }).join('<span style="color:rgba(255,255,255,0.15)"> · </span>');
                historyHtml = `<div class="set-history">${setSpans}</div>`;
            }
        }

        return `
        <div class="game-card">
            <div class="card-meta">Court ${game.court}</div>
            ${badgeHtml}

            <span class="team-home" style="color:${homeColor}">${homeCode}</span>
            <span class="vs-sep">vs</span>
            <span class="team-away" style="color:#aaaaaa">${esc(game.awayTeam || '')}</span>

            ${setsHtml ? '<div class="score-divider"></div>' : ''}
            ${setsHtml}
            ${currentHtml}
            ${historyHtml}
        </div>`;
    }

    function esc(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    refresh();
    setInterval(refresh, 5000);
</script>
</body>
</html>
